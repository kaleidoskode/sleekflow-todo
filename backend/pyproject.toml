[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleekflow-todo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uuid6>=2024.7.10",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

# The import package is `app`, which does not match the distribution name, so
# the backend has to be pointed at explicitly. Without a build-system at all,
# `uv sync` treats this as a non-installable project and `app` never reaches
# sys.path — which passes locally, where an earlier `pip install -e` left an
# editable install behind, and fails on any clean checkout.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI requires Depends/Query in argument defaults
]
